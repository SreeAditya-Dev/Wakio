# Local dev dependencies (Postgres + Redis).
# In production these are replaced by Supabase Postgres and a managed Redis.
services:
  postgres:
    image: postgres:16-alpine
    container_name: alarm_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alarm
    ports:
      - "5432:5432"
    volumes:
      - alarm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alarm_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  alarm_pgdata:
